<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/index.css">
  <link rel="stylesheet" href="/assets/css/post.css">
  <link rel="stylesheet" href="/assets/css/project.css">
  <link rel="stylesheet" href="/assets/css/certificate.css">
  <link rel="stylesheet" href="/assets/css/about.css">
  <link rel="stylesheet" href="/assets/css/header-footer.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="icon" type="image/ico" href="{{ site.baseurl }}/assets/images/favicon.ico">
</head>

<body id="lightMode">
   <script>
    //check theme before the page render
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-theme");
    }
  </script>

  {% include header.html %}
  <div class="layout-wrapper">
    
    <!-- Hamburger Button -->
    <button id="menuBtn" style="font-size: 30px; background: none; border: none; color: var(--text-heading); cursor: pointer;">
      &#9776; 
    </button>

    {% include navbar.html %}
    <main class="content">
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
</body>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.querySelector('.sidebar');

  menuBtn.addEventListener('click', () => {
    sidebar.classList.toggle('active');
  });

//change theme
function changeTheme() {
    const body = document.body;
    

    body.classList.toggle("dark-theme");


    if (body.classList.contains("dark-theme")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}
window.onload = function() {
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-theme");
    }
}
//

document.addEventListener("DOMContentLoaded", function () {
  const body = document.body;
  const zoomInBtn = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");
  const zoomResetBtn = document.getElementById("zoom-reset");

  // LocalStorage se saved zoom level get karein, default 100 rakhein
  let currentZoom = localStorage.getItem("siteZoom") ? parseInt(localStorage.getItem("siteZoom")) : 100;
  
  // Page load hone par saved zoom level apply karein
  body.style.fontSize = currentZoom + "%";

  function applyZoom(zoomLevel) {
      body.style.fontSize = zoomLevel + "%";
      localStorage.setItem("siteZoom", zoomLevel); // Browser me save karein
  }

  // Zoom In Function
  zoomInBtn.addEventListener("click", function () {
    if (currentZoom < 140) { // Max zoom limit 140%
      currentZoom += 10;
      applyZoom(currentZoom);
    }
  });

  // Zoom Out Function
  zoomOutBtn.addEventListener("click", function () {
    if (currentZoom > 80) { // Min zoom limit 80%
      currentZoom -= 10;
      applyZoom(currentZoom);
    }
  });

  // Reset Function
  zoomResetBtn.addEventListener("click", function () {
    currentZoom = 100;
    applyZoom(currentZoom);
  });
});
//
</script>
</html>

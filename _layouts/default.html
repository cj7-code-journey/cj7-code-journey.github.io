<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/index.css">
  <link rel="stylesheet" href="/assets/css/post.css">
  <link rel="stylesheet" href="/assets/css/project.css">
  <link rel="stylesheet" href="/assets/css/certificate.css">
  <link rel="stylesheet" href="/assets/css/about.css">
  <link rel="stylesheet" href="/assets/css/header-footer.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <link rel="icon" type="image/ico" href="{{ site.baseurl }}/assets/images/favicon.ico">
</head>

<body id="lightMode">
   <script>
    //check theme before the page render
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-theme");
    }
  </script>

  {% include header.html %}
  <div class="layout-wrapper">
    
    <!-- Hamburger Button -->
    <button id="menuBtn" style="font-size: 30px; background: none; border: none; color: var(--text-heading); cursor: pointer;">
      &#9776; 
    </button>

    {% include navbar.html %}
    <main class="content">
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
</body>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.querySelector('.sidebar');

  menuBtn.addEventListener('click', () => {
    sidebar.classList.toggle('active');
  });

//change theme
function changeTheme() {
    const body = document.body;
    

    body.classList.toggle("dark-theme");


    if (body.classList.contains("dark-theme")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}
window.onload = function() {
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-theme");
    }
}

</script>
</html>
